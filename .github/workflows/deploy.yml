# main 에 올릴 때마다 테스트 → 빌드 → GitHub Pages 배포
# Pages 설정은 configure-pages 단계가 자동으로 켠다. 안 되면 Settings → Pages → Source 를 "GitHub Actions" 로
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --mode pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # 저장소의 Pages 설정을 자동으로 켠다 (처음 한 번)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
